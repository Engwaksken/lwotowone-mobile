name: Flutter checks and test APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Actual HTTPS Laravel API URL ending in /api'
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Validate API address
        if: github.event_name == 'workflow_dispatch'
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: python3 scripts/check_api_url.py
      - name: Build test APK
        if: github.event_name == 'workflow_dispatch'
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug "--dart-define=API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: lwotowone-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
